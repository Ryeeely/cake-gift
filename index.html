<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>心意蛋糕工坊 · 精准加载提示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Patrick Hand', 'Comic Neue', cursive;
            overflow: hidden;
            background-color: #fdfbf7;
            background-image: radial-gradient(#e5e0d8 1.2px, transparent 1.2px);
            background-size: 28px 28px;
        }
        @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap');
        
        .fullscreen-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fdfbf7;
            background-image: radial-gradient(#e5e0d8 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .card {
            background: #ffffff;
            border: 3px solid #2d2d2d;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 32px 28px;
            max-width: 500px;
            width: 85%;
            box-shadow: 8px 8px 0px 0px #2d2d2d;
            text-align: center;
            transform: rotate(-0.5deg);
        }
        .card h2 { font-family: 'Kalam', cursive; font-size: 2rem; }
        .card input, .card button {
            width: 100%;
            padding: 12px;
            border-radius: 45px 8px 38px 8px / 8px 48px 8px 42px;
            border: 2px solid #2d2d2d;
            margin-bottom: 16px;
            font-size: 1rem;
            background: white;
            font-family: 'Patrick Hand', cursive;
        }
        .card button {
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px 0px #2d2d2d;
        }
        .card button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #2d2d2d !important;
        }
        .choice-buttons { display: flex; gap: 24px; justify-content: center; margin-top: 20px; }
        .choice-btn {
            background: #ffffff;
            border: 3px solid #2d2d2d;
            padding: 14px 32px;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Kalam', cursive;
            box-shadow: 5px 5px 0px 0px #2d2d2d;
        }
        .hidden { visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }
        
        /* 烘焙问答界面容器 - 增加滚动 */
        .kitchen-scene {
            background: #fff9ef;
            border: 4px solid #2d2d2d;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 20px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 12px 12px 0px 0px #2d2d2d;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .kitchen-scene::-webkit-scrollbar {
            width: 6px;
            background: #e0c8a0;
            border-radius: 10px;
        }
        .kitchen-scene::-webkit-scrollbar-thumb {
            background: #b45f1b;
            border-radius: 10px;
        }
        
        .photo-preview-small {
            max-width: 200px;
            max-height: 150px;
            border-radius: 45px 8px 38px 8px / 8px 48px 8px 42px;
            border: 3px solid #2d2d2d;
            margin-bottom: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .bowl-area {
            background: #f0e6d2;
            border-radius: 188px 12px 175px 12px / 12px 198px 12px 185px;
            padding: 15px;
            margin: 20px 0;
        }
        .bowl {
            width: 200px;
            height: 120px;
            background: #e0c8a0;
            border-radius: 0 0 100px 100px;
            border: 3px solid #2d2d2d;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .ingredients {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            font-size: 28px;
        }
        .question-box {
            background: #fff8e7;
            border: 2px dashed #2d2d2d;
            border-radius: 188px 12px 175px 12px / 12px 198px 12px 185px;
            padding: 20px;
            margin: 15px 0;
        }
        .option-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .option-btn {
            background: #fff;
            border: 2px solid #2d2d2d;
            border-radius: 88px 8px 78px 8px / 8px 88px 8px 78px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Patrick Hand', cursive;
        }
        .option-btn.selected { background: #ff4d4d; color: white; }
        .oven {
            background: #c0a080;
            border: 3px solid #2d2d2d;
            border-radius: 45px 8px 38px 8px / 8px 48px 8px 42px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 1.3rem;
            font-family: 'Kalam', cursive;
            font-weight: bold;
            box-shadow: 5px 5px 0px 0px #2d2d2d;
            opacity: 0.6;
            pointer-events: none;
            margin-top: 20px;
        }
        .oven.active { opacity: 1; pointer-events: auto; }
        @keyframes dropIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .drop-animation { animation: dropIn 0.3s ease-out forwards; }
        
        /* 品鉴页容器 - 增加滚动 */
        .tasting-fullscreen { background: rgba(255, 250, 240, 0.96); backdrop-filter: blur(8px); align-items: flex-start; padding-top: 10vh; }
        .tasting-card-full {
            max-width: 650px;
            width: 90%;
            background: #ffffff;
            border: 4px solid #2d2d2d;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            padding: 40px 36px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .tasting-card-full::-webkit-scrollbar {
            width: 6px;
            background: #e0c8a0;
            border-radius: 10px;
        }
        .tasting-card-full::-webkit-scrollbar-thumb {
            background: #b45f1b;
            border-radius: 10px;
        }
        .close-tasting {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            z-index: 1;
        }
        .feeling-tag {
            background: #fff0c8;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 2px solid #2d2d2d;
        }
        .desc-block { text-align: left; margin: 24px 0; line-height: 1.5; }
        .desc-block p { margin: 12px 0; }
        .message-large {
            font-size: 1.5rem;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e0c8a0;
            font-family: 'Kalam', cursive;
            color: #b45f1b;
            text-align: center;
        }
        .guide-text {
            font-size: 0.85rem;
            color: #b45f1b;
            background: #fef5e0;
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            margin-top: 12px;
            border: 1px solid #e0c8a0;
            font-family: 'Patrick Hand', cursive;
        }
        .view-intro-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ffffff;
            border: 3px solid #2d2d2d;
            border-radius: 88px 8px 78px 8px / 8px 88px 8px 78px;
            padding: 10px 20px;
            font-family: 'Kalam', cursive;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 6px 6px 0px 0px #2d2d2d;
            z-index: 20;
        }
        
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 188px 12px 175px 12px / 12px 198px 12px 185px;
            border: 3px solid #2d2d2d;
            color: #2d2d2d;
            pointer-events: auto;
            font-family: 'Patrick Hand', cursive;
            box-shadow: 8px 8px 0px 0px rgba(45,45,45,0.2);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .ui-panel.expanded {
            width: 380px;
            max-width: calc(100% - 40px);
            padding: 16px 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .ui-panel.collapsed {
            width: auto;
            padding: 8px;
            background: rgba(253, 251, 247, 0.98);
            cursor: pointer;
            border-radius: 60px;
        }
        .ui-panel.collapsed .panel-content {
            display: none;
        }
        .panel-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 8px;
        }
        .collapse-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            font-family: 'Kalam', cursive;
            font-weight: bold;
            color: #2d2d2d;
            padding: 4px 8px;
            border-radius: 40px;
            transition: 0.1s;
        }
        .collapse-btn:hover {
            background: rgba(0,0,0,0.05);
        }
        .collapsed .collapse-btn {
            margin: 0;
            font-size: 1.6rem;
        }
        .collapsed .collapse-btn::before {
            content: "⚙️";
            margin-right: 4px;
        }
        .collapsed .collapse-btn span {
            display: none;
        }
        .expanded .collapse-btn span {
            display: inline;
        }
        .expanded .collapse-btn::before {
            content: "🔽 ";
        }
        
        .mode-switch { display: flex; gap: 10px; margin: 12px 0; }
        .mode-btn {
            background: #fff;
            border: 2px solid #2d2d2d;
            flex: 1;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 88px 8px 78px 8px / 8px 88px 8px 78px;
        }
        .mode-btn.active { background: #ff4d4d; color: white; }
        .part-selector { margin: 12px 0; }
        .part-selector select {
            width: 100%;
            padding: 8px;
            border-radius: 40px;
            border: 2px solid #2d2d2d;
            background: white;
            font-family: 'Patrick Hand', cursive;
            font-size: 1rem;
        }
        .color-swatches { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
        .color-chip { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #2d2d2d; }
        .photo-preview {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 45px 8px 38px 8px / 8px 48px 8px 42px;
            margin-top: 8px;
            border: 2px solid #2d2d2d;
            cursor: crosshair;
        }
        .pick-tip { background: #e5e0d8; padding: 5px; border-radius: 20px; margin-top: 8px; text-align: center; }
        .gift-buttons { display: flex; gap: 10px; margin-top: 12px; }
        .env-color-selector { margin: 12px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .env-color-selector label { font-size: 0.9rem; }
        .env-color-selector input { width: 60px; height: 40px; border: 2px solid #2d2d2d; border-radius: 20px; cursor: pointer; background: white; }
        
        .dark-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            background-image: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.12) 0%, #000000 90%);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #ffd966;
            font-family: 'Kalam', cursive;
            cursor: pointer;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        .candle-instruction {
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 60px;
            border: 2px solid #ffd966;
            font-size: 1.8rem;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.02);}
        }
        .candle-instruction span {
            display: inline-block;
            animation: flicker 0.3s infinite alternate;
        }
        @keyframes flicker {
            0% { text-shadow: 0 0 2px #ffaa00; }
            100% { text-shadow: 0 0 12px #ff6600; }
        }
        
        /* 模型加载提示 */
        .loading-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            color: #ffefcf;
            font-family: 'Kalam', cursive;
            font-size: 1.4rem;
            padding: 16px 32px;
            border-radius: 80px;
            border: 2px solid #ffd966;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 9999;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #ffaa33;
        }
        @media (max-width: 600px) {
            .loading-hint {
                font-size: 1rem;
                padding: 12px 24px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <!-- 初始选择界面 -->
    <div id="choiceScreen" class="fullscreen-panel">
        <div class="card">
            <h1 style="font-size: 2.2rem;">🎂 心意蛋糕工坊 🎂</h1>
            <div class="choice-buttons">
                <button class="choice-btn" id="sendBtn">🎁 送出礼物</button>
                <button class="choice-btn" id="receiveBtn">📬 收到礼物</button>
            </div>
        </div>
    </div>

    <!-- 送出礼物：上传照片 -->
    <div id="sendUploadScreen" class="fullscreen-panel hidden">
        <div class="card">
            <h2>📸 上传一张照片</h2>
            <p style="margin-bottom: 16px;">选择照片，我们将提取颜色装饰你的蛋糕</p>
            <input type="file" id="sendPhotoInput" accept="image/jpeg,image/png,image/jpg">
            <button id="sendNextBtn" disabled>✏️ 下一步：制作蛋糕 →</button>
        </div>
    </div>

    <!-- 蛋糕制作主界面（3D + 控制面板） - 仅制作者可见 -->
    <div id="cakeMakerPanel" class="ui-panel expanded" style="display: none;">
        <div class="panel-header">
            <button id="collapsePanelBtn" class="collapse-btn"><span>折叠面板</span></button>
        </div>
        <div class="panel-content">
            <div><label>🎨 提取的色板 (自动模式)</label><div id="colorPalette" class="color-swatches"></div></div>
            <div class="mode-switch">
                <button id="autoModeBtn" class="mode-btn active">✨ 自动装饰</button>
                <button id="customModeBtn" class="mode-btn">🎨 亲手制作(吸色)</button>
            </div>
            <div id="customTool" style="display:none;">
                <div class="part-selector">
                    <label>🎨 选择部件：</label>
                    <select id="partSelect"></select>
                </div>
                <div class="pick-tip">✏️ 点击照片吸色 → 改变选中部件颜色</div>
            </div>
            <div class="env-color-selector">
                <label>✨ 蛋糕周围环境色：</label>
                <input type="color" id="envColorPicker" value="#ffaa88">
            </div>
            <div><label>💌 寄语</label><textarea id="makerMessage" rows="2" placeholder="写下你的祝福..." style="width:100%;"></textarea></div>
            <div class="gift-buttons"><button id="exportGiftBtn">💾 导出礼物文件</button></div>
        </div>
    </div>

    <!-- 收到礼物：导入文件 -->
    <div id="receiveImportScreen" class="fullscreen-panel hidden">
        <div class="card">
            <h2>📂 导入礼物文件</h2>
            <div class="guide-text" style="margin-bottom: 12px;">📌 提示：上传收到的 <strong>.json</strong> 格式礼物文件</div>
            <input type="file" id="receiveGiftInput" accept=".json">
            <button id="receiveNextBtn" disabled>🍰 开始制作蛋糕 →</button>
        </div>
    </div>

    <!-- 烘焙动画界面 -->
    <div id="bakingScreen" class="fullscreen-panel hidden">
        <div class="kitchen-scene">
            <h2 style="font-size: 1.8rem;">🧑‍🍳 亲手制作蛋糕</h2>
            <div class="guide-text" style="margin-bottom: 10px;">📌 提示：完成三道烹饪工序后选择【放入烤箱】</div>
            <img id="bakingPhoto" class="photo-preview-small" style="display: none;">
            <div class="bowl-area">
                <div class="bowl">
                    <div class="ingredients" id="ingredientsContainer"></div>
                </div>
                <p>🥣 搅拌碗</p>
            </div>
            <div id="questionContainer"></div>
            <div id="ovenBtn" class="oven">🔥 放入烤箱 🔥</div>
        </div>
    </div>

    <!-- 长按点亮蜡烛全黑过渡界面 -->
    <div id="candleLightScreen" class="dark-fullscreen hidden">
        <div class="candle-instruction">
            🕯️ 长按点亮蜡烛 🕯️
        </div>
        <div style="margin-top: 30px; font-size: 1rem; opacity: 0.8;">✨ 为蛋糕注入祝福 ✨</div>
    </div>

    <!-- 全屏品鉴页 -->
    <div id="tastingFullscreen" class="fullscreen-panel hidden tasting-fullscreen">
        <div class="tasting-card-full">
            <button class="close-tasting" id="closeTastingBtn">✕</button>
            <div id="tastingDynamicContent"></div>
            <div class="guide-text" style="margin-top: 20px;">📌 阅读完即可关闭简介，尽情欣赏蛋糕</div>
        </div>
    </div>

    <!-- 看简介按钮 -->
    <button id="viewIntroBtn" class="view-intro-btn" style="display: none;">📖 看简介</button>

    <!-- 模型加载提示（初始隐藏） -->
    <div id="modelLoadingHint" class="loading-hint" style="display: none;">🎂 模型加载中，请稍后...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/colorthief@2.3.2/dist/color-thief.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ---------- DOM 元素 ----------
        const choiceScreen = document.getElementById('choiceScreen');
        const sendUploadScreen = document.getElementById('sendUploadScreen');
        const cakeMakerPanel = document.getElementById('cakeMakerPanel');
        const receiveImportScreen = document.getElementById('receiveImportScreen');
        const bakingScreen = document.getElementById('bakingScreen');
        const tastingFullscreen = document.getElementById('tastingFullscreen');
        const tastingDynamicContent = document.getElementById('tastingDynamicContent');
        const closeTastingBtn = document.getElementById('closeTastingBtn');
        const viewIntroBtn = document.getElementById('viewIntroBtn');
        const sendPhotoInput = document.getElementById('sendPhotoInput');
        const sendNextBtn = document.getElementById('sendNextBtn');
        const exportGiftBtn = document.getElementById('exportGiftBtn');
        const makerMessage = document.getElementById('makerMessage');
        const receiveGiftInput = document.getElementById('receiveGiftInput');
        const receiveNextBtn = document.getElementById('receiveNextBtn');
        const bakingPhoto = document.getElementById('bakingPhoto');
        const questionContainer = document.getElementById('questionContainer');
        const ingredientsContainer = document.getElementById('ingredientsContainer');
        const ovenBtn = document.getElementById('ovenBtn');
        const envColorPicker = document.getElementById('envColorPicker');
        const candleLightScreen = document.getElementById('candleLightScreen');
        const collapsePanelBtn = document.getElementById('collapsePanelBtn');
        const modelLoadingHint = document.getElementById('modelLoadingHint');
        
        // 全局变量
        let currentMakerImageBase64 = null;
        let currentPalette = null;
        let importedGift = null;
        let q1Answer = null, q2Answer = null, q3Answer = null;
        let giftMessage = "";
        let currentStep = 1;
        let currentFullDescHTML = "";
        
        // 模型加载状态标志
        let isModelLoaded = false;
        let onModelLoadCallbacks = [];
        
        // 注册模型加载完成回调
        function onModelLoaded(callback) {
            if (isModelLoaded) {
                callback();
            } else {
                onModelLoadCallbacks.push(callback);
            }
        }
        
        // 显示或隐藏加载提示（手动控制）
        function showLoadingHint() {
            if (!isModelLoaded) {
                modelLoadingHint.style.display = 'flex';
            }
        }
        
        function hideLoadingHint() {
            modelLoadingHint.style.display = 'none';
        }
        
        // 面板折叠逻辑
        let isPanelCollapsed = false;
        function togglePanel() {
            if (isPanelCollapsed) {
                cakeMakerPanel.classList.remove('collapsed');
                cakeMakerPanel.classList.add('expanded');
                collapsePanelBtn.innerHTML = '<span>折叠面板</span>';
                isPanelCollapsed = false;
            } else {
                cakeMakerPanel.classList.remove('expanded');
                cakeMakerPanel.classList.add('collapsed');
                collapsePanelBtn.innerHTML = '<span>展开</span>';
                isPanelCollapsed = true;
            }
        }
        collapsePanelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePanel();
        });
        cakeMakerPanel.addEventListener('click', (e) => {
            if (isPanelCollapsed && (e.target === cakeMakerPanel || e.target.classList.contains('collapse-btn'))) {
                togglePanel();
            }
        });
        
        // ---------- Three.js 场景 ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1030);
        scene.fog = new THREE.FogExp2(0x0a1030, 0.008);
        
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 3.2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        function createStarTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);
            const centerX = 32, centerY = 32, outerR = 28, innerR = 12, points = 5;
            let step = Math.PI / points;
            let rot = Math.PI / 2 * 3;
            ctx.beginPath();
            for (let i = 0; i < points; i++) {
                const x1 = centerX + Math.cos(rot + i * step * 2) * outerR;
                const y1 = centerY + Math.sin(rot + i * step * 2) * outerR;
                const x2 = centerX + Math.cos(rot + (i * step * 2 + step)) * innerR;
                const y2 = centerY + Math.sin(rot + (i * step * 2 + step)) * innerR;
                if (i === 0) ctx.moveTo(x1, y1);
                else ctx.lineTo(x1, y1);
                ctx.lineTo(x2, y2);
            }
            ctx.closePath();
            ctx.fillStyle = colorHex;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,200,0.8)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }
        
        function generateStars(colorPoolHexStrings) {
            while(starGroup.children.length) starGroup.remove(starGroup.children[0]);
            currentStars = [];
            for (let i = 0; i < 55; i++) {
                const randomColor = colorPoolHexStrings[Math.floor(Math.random() * colorPoolHexStrings.length)];
                const tex = createStarTexture(randomColor);
                const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending });
                const sprite = new THREE.Sprite(mat);
                const r = 1.6 + Math.random() * 2.6;
                const a = Math.random() * Math.PI * 2;
                const h = -0.3 + Math.random() * 3.4;
                sprite.position.set(Math.cos(a)*r, h, Math.sin(a)*r);
                const s = 0.1 + Math.random() * 0.18;
                sprite.scale.set(s, s, 1);
                starGroup.add(sprite);
                currentStars.push({ sprite, speed: 0.003+Math.random()*0.012, angle: a, radius: r });
            }
        }
        
        const particleCount = 800;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 1.5 + Math.random() * 1.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = Math.sin(phi) * Math.cos(theta) * radius;
            const z = Math.sin(phi) * Math.sin(theta) * radius;
            const y = Math.sin(phi) * radius * 0.8 + 1.2;
            particlePositions[i*3] = x;
            particlePositions[i*3+1] = y;
            particlePositions[i*3+2] = z;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.035, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.6 });

        let colorThief = new ColorThief();
        
        async function getRichColorPalette(imgElement) {
            const mainColors = colorThief.getPalette(imgElement, 10);
            const mainHex = mainColors.map(c => (c[0] << 16) | (c[1] << 8) | c[2]);
            const canvas = document.createElement('canvas');
            canvas.width = imgElement.width;
            canvas.height = imgElement.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgElement, 0, 0, imgElement.width, imgElement.height);
            const imageData = ctx.getImageData(0, 0, imgElement.width, imgElement.height);
            const data = imageData.data;
            const sampleColors = [];
            const sampleCount = 40;
            for (let i = 0; i < sampleCount; i++) {
                const x = Math.floor(Math.random() * imgElement.width);
                const y = Math.floor(Math.random() * imgElement.height);
                const idx = (y * imgElement.width + x) * 4;
                const r = data[idx];
                const g = data[idx+1];
                const b = data[idx+2];
                const hex = (r << 16) | (g << 8) | b;
                sampleColors.push(hex);
            }
            const allColors = [...mainHex, ...sampleColors];
            const uniqueColors = [];
            const seen = new Set();
            for (let col of allColors) {
                if (!seen.has(col)) {
                    seen.add(col);
                    uniqueColors.push(col);
                    if (uniqueColors.length >= 30) break;
                }
            }
            return uniqueColors;
        }
        
        function extractAndApply(imageFile, callback) {

                    const hexColors = colorPool.slice(0, 8);
                    currentPalette = hexColors;
                    applyColorsToAllMaterials(hexColors);
                    setPhotoBackground(e.target.result);
                    currentMakerImageBase64 = e.target.result;
                    
                    const starColorHexStrings = colorPool.map(c => '#' + c.toString(16).padStart(6,'0'));
                    generateStars(starColorHexStrings);
                    
                    if (callback) callback(hexColors);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(imageFile);
        }

            const span = document.createElement('span');
            span.textContent = emoji;
            span.classList.add('drop-animation');
            ingredientsContainer.appendChild(span);
        }
        
        function renderCurrentQuestion() {
            if (currentStep === 1) {
                questionContainer.innerHTML = `
                    <div class="question-box">
                        <p>📖 第一题：这张照片给你什么感觉？</p>
                        <div class="option-row">
                            <div class="option-btn" data-q1="bright">☀️ 明媚的</div>
                            <div class="option-btn" data-q1="calm">🌙 宁静的</div>
                            <div class="option-btn" data-q1="fresh">💧 清新的</div>
                        </div>
                    </div>
                `;
                document.querySelectorAll('[data-q1]').forEach(btn => {
                    btn.onclick = () => {
                        if (q1Answer) return;
                        q1Answer = btn.dataset.q1;
                        document.querySelectorAll('[data-q1]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        if (q1Answer === 'bright') addIngredient('🍓');
                        else if (q1Answer === 'calm') addIngredient('🍌');
                        else addIngredient('🍋');
                        setTimeout(() => { currentStep = 2; renderCurrentQuestion(); }, 800);
                    };
                });
            } else if (currentStep === 2) {
                questionContainer.innerHTML = `
                    <div class="question-box">
                        <p>📖 第二题：这张照片接近什么味道？</p>
                        <div class="option-row">
                            <div class="option-btn" data-q2="sugar">🍬 白砂糖</div>
                            <div class="option-btn" data-q2="salt">🧂 海盐</div>
                            <div class="option-btn" data-q2="lime">🍋 青柠</div>
                        </div>
                    </div>
                `;
                document.querySelectorAll('[data-q2]').forEach(btn => {
                    btn.onclick = () => {
                        if (q2Answer) return;
                        q2Answer = btn.dataset.q2;
                        document.querySelectorAll('[data-q2]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        if (q2Answer === 'sugar') addIngredient('🍬');
                        else if (q2Answer === 'salt') addIngredient('🧂');
                        else addIngredient('🍋');
                        setTimeout(() => { currentStep = 3; renderCurrentQuestion(); }, 800);
                    };
                });
            } else if (currentStep === 3) {
                questionContainer.innerHTML = `
                    <div class="question-box">
                        <p>📖 第三题：这张照片听起来像什么？</p>
                        <div class="option-row">
                            <div class="option-btn" data-q3="light">🎵 轻快的旋律</div>
                            <div class="option-btn" data-q3="slow">🎻 舒缓的旋律</div>
                            <div class="option-btn" data-q3="rhythmic">🥁 有节奏感的律动</div>
                        </div>
                    </div>
                `;
                document.querySelectorAll('[data-q3]').forEach(btn => {
                    btn.onclick = () => {
                        if (q3Answer) return;
                        q3Answer = btn.dataset.q3;
                        document.querySelectorAll('[data-q3]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        if (q3Answer === 'light') addIngredient('🥚');
                        else if (q3Answer === 'slow') addIngredient('🍫');
                        else addIngredient('🌰');
                        setTimeout(() => { ovenBtn.classList.add('active'); }, 800);
                    };
                });
            }
        }
        
        function showTastingFullscreen() {
            if (!currentFullDescHTML) currentFullDescHTML = buildTastingHTML();
            tastingDynamicContent.innerHTML = currentFullDescHTML;
            tastingFullscreen.classList.remove('hidden');
        }
        
        function handleOvenClick() {
            if (ovenBtn.classList.contains('active') && q1Answer && q2Answer && q3Answer) {
                if (importedGift) applyGiftToView(importedGift);
                bakingScreen.classList.add('hidden');
                candleLightScreen.classList.remove('hidden');
            } else {
                alert("请先完成所有三个问题！");
            }
        }
        
        ovenBtn.onclick = handleOvenClick;
        
        let pressTimer = null;
        const longPressDuration = 800;
        
        function onPressStart(e) {
            e.preventDefault();
            pressTimer = setTimeout(() => {
                candleLightScreen.classList.add('hidden');
                showTastingFullscreen();
                // 长按点亮后，关闭品鉴页时会显示加载提示，此处不主动显示
                pressTimer = null;
            }, longPressDuration);
        }
        
        function onPressEnd(e) {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }
        
        candleLightScreen.addEventListener('mousedown', onPressStart);
        candleLightScreen.addEventListener('mouseup', onPressEnd);
        candleLightScreen.addEventListener('touchstart', onPressStart);
        candleLightScreen.addEventListener('touchend', onPressEnd);
        candleLightScreen.addEventListener('mouseleave', onPressEnd);
        
        // 关闭品鉴页后，进入蛋糕展示界面 -> 显示加载提示（如果模型未加载完成）
        closeTastingBtn.onclick = () => {
            tastingFullscreen.classList.add('hidden');
            viewIntroBtn.style.display = 'block';
            // 场景2：关闭简介后的蛋糕展示界面，如果模型未加载完成，显示提示
            if (!isModelLoaded) {
                showLoadingHint();
                // 注册回调，加载完成后隐藏
                onModelLoaded(() => {
                    hideLoadingHint();
                });
            } else {
                hideLoadingHint();
            }
        };
        
        viewIntroBtn.onclick = () => {
            if (currentFullDescHTML) {
                tastingDynamicContent.innerHTML = currentFullDescHTML;
                tastingFullscreen.classList.remove('hidden');
            } else showTastingFullscreen();
        };
        
        let receivedGiftFile = null;
        receiveGiftInput.onchange = (e) => {
            receivedGiftFile = e.target.files[0];
            receiveNextBtn.disabled = !receivedGiftFile;
        };
        receiveNextBtn.onclick = async () => {
            if (!receivedGiftFile) return;
            try {
                const gift = await importGiftFile(receivedGiftFile);
                if (gift.photoBase64) {
                    bakingPhoto.src = gift.photoBase64;
                    bakingPhoto.style.display = 'block';
                }
                q1Answer = q2Answer = q3Answer = null;
                currentStep = 1;
                ingredientsContainer.innerHTML = '';
                ovenBtn.classList.remove('active');
                receiveImportScreen.classList.add('hidden');
                bakingScreen.classList.remove('hidden');
                renderCurrentQuestion();
            } catch(err) { alert("文件无效"); }
        };
        
        document.getElementById('sendBtn').onclick = () => {
            choiceScreen.classList.add('hidden');
            sendUploadScreen.classList.remove('hidden');
        };
        document.getElementById('receiveBtn').onclick = () => {
            choiceScreen.classList.add('hidden');
            receiveImportScreen.classList.remove('hidden');
        };
        
        let uploadedFile = null;
        sendPhotoInput.onchange = (e) => {
            uploadedFile = e.target.files[0];
            sendNextBtn.disabled = !uploadedFile;
        };
        sendNextBtn.onclick = () => {
            if (!uploadedFile) return;
            extractAndApply(uploadedFile, (colors) => {
                const container = document.getElementById('colorPalette');
                container.innerHTML = '';
                colors.forEach(c => {
                    const chip = document.createElement('div');
                    chip.className = 'color-chip';
                    chip.style.backgroundColor = `#${c.toString(16).padStart(6,'0')}`;
                    container.appendChild(chip);
                });
                const previewImg = document.createElement('img');
                previewImg.id = 'previewImg';
                previewImg.className = 'photo-preview';
                previewImg.src = currentMakerImageBase64;
                const wrapper = document.getElementById('photoWrapper');
                if (!wrapper) {
                    const newWrapper = document.createElement('div');
                    newWrapper.id = 'photoWrapper';
                    document.querySelector('#cakeMakerPanel .panel-content').insertBefore(newWrapper, document.getElementById('colorPalette').parentNode.nextSibling);
                    newWrapper.appendChild(previewImg);
                } else {
                    wrapper.innerHTML = '';
                    wrapper.appendChild(previewImg);
                }
                sendUploadScreen.classList.add('hidden');
                cakeMakerPanel.style.display = 'block';
                // 场景1：制作蛋糕界面（上传完图片后），如果模型未加载完成，显示提示
                if (!isModelLoaded) {
                    showLoadingHint();
                    onModelLoaded(() => {
                        hideLoadingHint();
                    });
                } else {
                    hideLoadingHint();
                }
                setupMakerUI();
            });
        };
        exportGiftBtn.onclick = exportGift;
        
        let isCustomMode = false;
        let pickActive = false;
        let currentPickHandler = null;
        
        function enablePickMode() {
            if (!currentMakerImageBase64) { alert("请先上传照片"); return; }
            pickActive = true;
            const previewImg = document.getElementById('previewImg');
            if (!previewImg) return;
            previewImg.style.cursor = 'crosshair';
            const getColor = (e) => {
                if (!pickActive) return;
                const img = new Image();
                img.src = currentMakerImageBase64;
                img.onload = () => {
                    const rect = previewImg.getBoundingClientRect();
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const scaleX = img.width / rect.width;
                    const scaleY = img.height / rect.height;
                    const x = (e.clientX - rect.left) * scaleX;
                    const y = (e.clientY - rect.top) * scaleY;
                    if (x>=0 && x<img.width && y>=0 && y<img.height) {
                        const pixel = ctx.getImageData(x, y, 1, 1).data;
                        const hex = (pixel[0]<<16)|(pixel[1]<<8)|pixel[2];
                        applyColorToSelectedPart(hex);
                        const geom = new THREE.BufferGeometry();
                        const pos = new Float32Array(30*3);
                        for(let i=0;i<30;i++) {
                            pos[i*3] = (Math.random()-0.5)*1.2;
                            pos[i*3+1] = Math.random()*1.8+0.8;
                            pos[i*3+2] = (Math.random()-0.5)*1.2;
                        }
                        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                        const partSys = new THREE.Points(geom, new THREE.PointsMaterial({ color: hex, size: 0.07 }));
                        scene.add(partSys);
                        setTimeout(() => scene.remove(partSys), 500);
                    }
                };
            };
            previewImg.addEventListener('click', getColor);
            currentPickHandler = getColor;
        }
        
        function disablePickMode() {
            pickActive = false;
            if (currentPickHandler) {
                const preview = document.getElementById('previewImg');
                if (preview) preview.removeEventListener('click', currentPickHandler);
                currentPickHandler = null;
            }
        }
        
        function setupMakerUI() {
            const autoBtn = document.getElementById('autoModeBtn');
            const customBtn = document.getElementById('customModeBtn');
            const partSelect = document.getElementById('partSelect');
            autoBtn.onclick = () => {
                if (isCustomMode) disablePickMode();
                isCustomMode = false;
                customBtn.classList.remove('active');
                autoBtn.classList.add('active');
                document.getElementById('customTool').style.display = 'none';
                if (currentPalette) applyColorsToAllMaterials(currentPalette);
            };
            customBtn.onclick = () => {
                isCustomMode = true;
                autoBtn.classList.remove('active');
                customBtn.classList.add('active');
                document.getElementById('customTool').style.display = 'block';
                if (partSelect) {
                    partSelect.onchange = (e) => { currentSelectedPart = e.target.value; };
                    currentSelectedPart = partSelect.value;
                }
                enablePickMode();
            };
            if (partSelect && partSelect.value) currentSelectedPart = partSelect.value;
        }
        
        // 自动上下浮动
        let userInteracting = false;
        let autoFloatTimer = null;
        let autoFloatEnabled = true;
        let autoFloatTime = 0;
        let originalCameraY = camera.position.y;
        let originalTargetY = controls.target.y;
        const floatAmplitude = 0.12;
        const floatSpeed = 0.6;
        
        controls.addEventListener('start', () => {
            userInteracting = true;
            if (autoFloatTimer) clearTimeout(autoFloatTimer);
        });
        controls.addEventListener('end', () => {
            originalCameraY = camera.position.y;
            originalTargetY = controls.target.y;
            autoFloatTime = 0;
            autoFloatTimer = setTimeout(() => {
                userInteracting = false;
            }, 3000);
        });
        
        let lastTime = performance.now();
        function updateAutoFloat(deltaTime) {
            if (!autoFloatEnabled) return;
            if (userInteracting) return;
            if (!modelGroup) return;
            autoFloatTime += deltaTime;
            const offset = Math.sin(autoFloatTime * floatSpeed) * floatAmplitude;
            camera.position.y = originalCameraY + offset;
            controls.target.y = originalTargetY + offset;
        }
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            updateAutoFloat(delta);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        let animTime = 0;
        function starAndParticleAnim() {
            requestAnimationFrame(starAndParticleAnim);
            animTime += 0.016;
            currentStars.forEach(star => {
                if (star.sprite) {
                    star.angle += star.speed;
                    star.sprite.position.x = Math.cos(star.angle) * star.radius;
                    star.sprite.position.z = Math.sin(star.angle) * star.radius;
                }
            });
            if (particleSystem) particleSystem.rotation.y = animTime * 0.08;
        }
        starAndParticleAnim();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        generateStars(['#ffaa88', '#ffcc99', '#ffddbb', '#ffb347', '#ff8c42']);
        updateEnvironmentColor('#ffaa88');
        
        // 初始时隐藏加载提示，不在页面打开时显示
        hideLoadingHint();
    </script>
</body>
</html>
